<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <g transform="translate(100, 90)">
    <!-- Checklist bars -->
    <rect x="0" y="50" width="200" height="30" rx="15" fill="url(#blueGrad)" opacity="0.9"/>
    <rect x="0" y="95" width="200" height="30" rx="15" fill="url(#blueGrad)" opacity="0.7"/>
    <rect x="0" y="140" width="200" height="30" rx="15" fill="url(#blueGrad)" opacity="0.5"/>

    <!-- Checkbox -->
    <rect x="-10" y="44" width="36" height="36" rx="8" fill="white" stroke="#10b981" stroke-width="3"/>
    <polyline points="0,62 8,70 24,52" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arrow -->
    <path d="M 30 220 C 60 170, 100 120, 150 80 C 170 65, 195 50, 220 40"
          stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <polygon points="215,30 230,42 215,52" fill="url(#greenGrad)"/>

    <!-- Star -->
    <g filter="url(#glow)" transform="translate(200, 5)">
      <polygon points="30,0 37,21 60,22 43,37 48,60 30,47 12,60 17,37 0,22 23,21"
               fill="url(#starGrad)"/>
    </g>
  </g>

  <!-- Border ring -->
  <circle cx="256" cy="256" r="250" fill="none" stroke="#334155" stroke-width="2" opacity="0.3"/>
</svg>
