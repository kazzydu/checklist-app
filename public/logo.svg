<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="arrowShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Checklist bars (stacked blue bars) -->
    <rect x="15" y="20" width="100" height="16" rx="8" fill="url(#blueGrad)" opacity="0.9"/>
    <rect x="15" y="44" width="100" height="16" rx="8" fill="url(#blueGrad)" opacity="0.75"/>
    <rect x="15" y="68" width="100" height="16" rx="8" fill="url(#blueGrad)" opacity="0.6"/>
    <rect x="15" y="92" width="100" height="16" rx="8" fill="url(#blueGrad)" opacity="0.45"/>

    <!-- Checkbox with green checkmark -->
    <rect x="3" y="18" width="18" height="18" rx="4" fill="white" stroke="#10b981" stroke-width="2"/>
    <polyline points="7,27 11,31 19,22" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Upward sweeping arrow -->
    <path d="M 25 110 C 40 90, 55 65, 80 45 C 90 36, 105 28, 120 22" 
          stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#arrowShadow)"/>
    <!-- Arrowhead -->
    <polygon points="118,16 128,22 118,28" fill="url(#greenGrad)"/>

    <!-- Glowing star -->
    <g filter="url(#starGlow)" transform="translate(115, 5)">
      <polygon points="15,0 18.5,10.5 30,11 21.5,18.5 24,30 15,23 6,30 8.5,18.5 0,11 11.5,10.5" 
               fill="url(#starGrad)"/>
      <polygon points="15,4 17,11 24,11.5 19,16 20.5,24 15,19.5 9.5,24 11,16 6,11.5 13,11" 
               fill="#6ee7b7" opacity="0.5"/>
    </g>
  </g>

  <!-- Title Text -->
  <text x="160" y="165" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#2563eb">Milestone</tspan><tspan fill="#10b981">Mindset</tspan>
  </text>

  <!-- Tagline -->
  <text x="160" y="190" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" letter-spacing="0.5">
    Set Goals. Track Progress. Achieve Growth.
  </text>
</svg>
