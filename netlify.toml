[build]
  command = "npm run build"
  publish = "dist"

# Firebase web config values (API key, auth domain, project ID, sender/app IDs,
# measurement ID, and the public Web Push VAPID key) are designed to be public.
# Vite inlines every VITE_-prefixed variable into the client bundle, so these
# necessarily appear in dist/. Access is controlled by Firebase Security Rules
# and authorized-domain settings, not by keeping these values hidden.
# Excluded from secrets scanning so the build does not fail on them.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_VAPID_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
